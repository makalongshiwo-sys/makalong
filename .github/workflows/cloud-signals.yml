name: Public Guanchao signal feed
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-signals.yml']
permissions:
  contents: write
concurrency:
  group: guanchao-public-signal-feed
  cancel-in-progress: false
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7ea7a67d1287b7f4baa295a3dd37a8328aee023e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile shared candle semantics and preserve bounded worker
        run: |
          mkdir -p "$RUNNER_TEMP/guanchao-public-monitor/out/cloud"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/guanchao-public-monitor/out/cloud" app/src/main/java/com/tide/journal/domain/Market.java cloud/CloudAnalysis.java
          cp cloud/monitor.py "$RUNNER_TEMP/guanchao-public-monitor/monitor.py"
          mkdir -p "$RUNNER_TEMP/guanchao-public-monitor/signals"
          git fetch origin guanchao-live-signals
          git show FETCH_HEAD:signals/state.json > "$RUNNER_TEMP/guanchao-public-monitor/signals/state.json"
      - name: Monitor public source in a finite batch and preserve feed independently of reports
        working-directory: ${{ runner.temp }}/guanchao-public-monitor
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          for round in {1..10}; do
            result=$(python monitor.py)
            echo "$result"
            git -C "$GITHUB_WORKSPACE" fetch origin guanchao-live-signals
            git -C "$GITHUB_WORKSPACE" checkout -B live-state FETCH_HEAD
            mkdir -p "$GITHUB_WORKSPACE/signals"
            cp signals/state.json "$GITHUB_WORKSPACE/signals/state.json"
            git -C "$GITHUB_WORKSPACE" add signals/state.json
            git -C "$GITHUB_WORKSPACE" -c user.name='Guanchao signal feed' -c user.email='actions@users.noreply.github.com' commit -m 'Refresh public source-backed signals'
            git -C "$GITHUB_WORKSPACE" push origin HEAD:guanchao-live-signals
            if [[ "$result" == 'NEW_SIGNALS=true' ]]; then
              curl --fail --silent --show-error --max-time 15 \
                -H 'Content-Type: application/json' \
                -d "{\"topic\":\"guanchao-signals-$REPOSITORY_ID\",\"message\":\"refresh\",\"priority\":1}" \
                https://ntfy.sh/ || echo 'Wake failed; native periodic fetch remains enabled'
            fi
            if [[ "$round" != '10' ]]; then sleep 60; fi
          done
